definitions:
  entity.AddSysAdminDto:
    properties:
      deptId:
        type: integer
      email:
        type: string
      nickname:
        type: string
      note:
        type: string
      password:
        type: string
      phone:
        type: string
      postId:
        type: integer
      roleId:
        type: integer
      status:
        type: integer
      username:
        type: string
    required:
    - deptId
    - email
    - nickname
    - password
    - phone
    - postId
    - roleId
    - status
    - username
    type: object
  entity.CreateSysDeptDto:
    properties:
      deptName:
        type: string
      deptStatus:
        type: integer
      deptType:
        type: integer
      parentId:
        type: integer
    type: object
  entity.DelSysPostDto:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  entity.LoginDto:
    properties:
      idKey:
        type: string
      image:
        description: 验证码
        maxLength: 6
        minLength: 4
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - idKey
    - image
    - password
    - username
    type: object
  entity.ResetSysAdminPasswordDto:
    properties:
      id:
        type: integer
      password:
        type: string
    type: object
  entity.RoleMenu:
    properties:
      id:
        type: integer
      menuIds:
        items:
          type: integer
        type: array
    required:
    - id
    - menuIds
    type: object
  entity.SysAdminIdDto:
    properties:
      id:
        type: integer
    type: object
  entity.SysDept:
    properties:
      children:
        items:
          $ref: '#/definitions/entity.SysDept'
        type: array
      createTime:
        $ref: '#/definitions/util.HTime'
      deptName:
        type: string
      deptStatus:
        type: integer
      deptType:
        type: integer
      id:
        type: integer
      parentId:
        type: integer
    type: object
  entity.SysDeptIdDto:
    properties:
      id:
        type: integer
    type: object
  entity.SysLoginDto:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  entity.SysLoginIdDto:
    properties:
      id:
        type: integer
    type: object
  entity.SysMenu:
    properties:
      children:
        items:
          $ref: '#/definitions/entity.SysMenu'
        type: array
      createTime:
        $ref: '#/definitions/util.HTime'
      icon:
        type: string
      id:
        type: integer
      menuName:
        type: string
      menuStatus:
        type: integer
      menuType:
        type: integer
      parentId:
        type: integer
      sort:
        type: integer
      url:
        type: string
      value:
        type: string
    type: object
  entity.SysMenuIdDto:
    properties:
      id:
        type: integer
    type: object
  entity.SysOperateIdsDto:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  entity.SysOperateLogDto:
    properties:
      id:
        type: integer
    type: object
  entity.SysPost:
    properties:
      createTime:
        $ref: '#/definitions/util.HTime'
      id:
        type: integer
      postCode:
        type: string
      postName:
        type: string
      postStatus:
        type: integer
      remark:
        type: string
    type: object
  entity.SysPostIdDto:
    properties:
      id:
        type: integer
    type: object
  entity.SysRole:
    properties:
      createTime:
        $ref: '#/definitions/util.HTime'
      description:
        type: string
      id:
        type: integer
      roleKey:
        type: string
      roleName:
        type: string
      status:
        type: integer
    type: object
  entity.SysRoleDto:
    properties:
      id:
        type: integer
    type: object
  entity.UpdatePersonPwdDto:
    properties:
      id:
        type: integer
      newPassword:
        type: string
      password:
        type: string
      resetPassword:
        type: string
    required:
    - newPassword
    - password
    - resetPassword
    type: object
  entity.UpdateSysAdminDto:
    properties:
      deptId:
        type: integer
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      note:
        type: string
      phone:
        type: string
      postId:
        type: integer
      roleId:
        type: integer
      status:
        type: integer
      username:
        type: string
    type: object
  entity.UpdateSysAdminStatusDto:
    properties:
