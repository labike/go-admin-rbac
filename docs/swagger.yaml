        type: integer
      status:
        type: integer
    type: object
  entity.UpdateSysPostStatusDto:
    properties:
      id:
        type: integer
      postStatus:
        type: integer
    type: object
  entity.UpdateSysRole:
    properties:
      description:
        type: string
      id:
        type: integer
      roleKey:
        type: string
      roleName:
        type: string
      status:
        type: integer
    type: object
  entity.UpdateSysRoleStatus:
    properties:
      id:
        type: integer
      status:
        description: 1启用 2禁用
        type: integer
    type: object
  entity.UpdateUserDto:
    properties:
      email:
        type: string
      icon:
        type: string
      id:
        type: integer
      nickname:
        type: string
      note:
        type: string
      phone:
        type: string
      username:
        type: string
    required:
    - email
    - icon
    - nickname
    - note
    - phone
    - username
    type: object
  result.Result:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  util.HTime:
    properties:
      time.Time:
        type: string
    type: object
